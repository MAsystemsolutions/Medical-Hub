<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical Hub · Patient CRM for small clinics</title>
<meta name="description" content="Medical Hub: patient records, visits, follow-up reminders, intake documents and care plans for small clinics. Live demo with sample data.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234a6b8f'/><path d='M7 17h4l2-5 3 9 2-6 1 2h6' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #f7f5f2; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #4a6b8f; }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: #4a6b8f; display: grid; place-items: center; }
  .spin { width: 22px; height: 22px; border: 3px solid #d6e2ee; border-top-color: #4a6b8f; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #loading a { color: #4a6b8f; font-size: 13px; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity 0.3s; }
  iframe.ready { opacity: 1; }
</style>
</head>
<body>
  <div id="loading">
    <div class="mark"><svg width="24" height="24" viewBox="0 0 32 32"><path d="M5 17h5l2.5-6 3.5 11 2.5-7 1.5 2h7" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="spin"></div>
    <div>Opening Medical Hub…</div>
    <a id="direct" href="#" target="_blank" rel="noopener">Taking a while? Open the app directly</a>
  </div>

  <iframe id="app" title="Medical Hub" allow="clipboard-write"></iframe>

  <script>
    // ⬇️ Paste your Apps Script Web app URL here (Deploy → Manage deployments → copy the URL ending in /exec)
    const APP_URL = 'https://script.google.com/macros/s/AKfycbx8soXynzvmwKVqFeB_pNPXg4NPNMsOpcUDVvzrt-Z9SMwGgR18c6Tv7gEv7wFM8RjbBQ/exec';

    const frame = document.getElementById('app');
    document.getElementById('direct').href = APP_URL;
    frame.addEventListener('load', () => frame.classList.add('ready'));
    frame.src = APP_URL;
  </script>
</body>
</html>
